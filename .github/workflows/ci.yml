name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test --workspaces --if-present

      - run: npm pack --dry-run --workspace=packages/expo-shelfit

      - name: Smoke test — --help exits 0
        run: node packages/expo-shelfit/bin/cli.mjs --help

      - name: Smoke test — missing EXPO_TOKEN exits 1
        run: |
          set +e
          unset EXPO_TOKEN
          node packages/expo-shelfit/bin/cli.mjs
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 without EXPO_TOKEN, got $code"
            exit 1
          fi
