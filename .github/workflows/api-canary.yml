name: API Canary

# The EAS GraphQL API this CLI depends on is unofficial and unversioned, so
# field names can change without notice. This runs weekly against the real
# API so a break is caught here first, not by a user's bug report.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The default app list's AppOverview query aliases `submissions`/
      # `updateGroups` alongside `builds` in the same app.byId request, so
      # this one step already covers all three (BUILD/SUBMIT/UPDATE).
      - name: Run against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # --stats no longer queries subscription/billingPeriod at all — it
      # pages app.byId(...).builds(offset, limit, filter) per app and
      # buckets client-side by UTC calendar month + status (success/errored/
      # canceled). Separate step so a break in that pagination shape is
      # distinguishable from a break in the plain app/build queries above.
      - name: Run --stats against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs --stats
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # --month widens --stats' pagination window (up to 12 months) rather
      # than changing query shape, but a separate step still catches an
      # unexpected error/timeout from the deeper paging on its own.
      - name: Run --stats --month 6 against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs --stats --month 6
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # AppOverview's builds aliases take a $limit variable for --history; a
      # separate step so a break in that variable/shape is distinguishable
      # from a break in the plain (limit: 1) query above.
      - name: Run --history against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs --history 5
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # --members queries `subscription`/`ownerUserActor`/`membersPaginated`
      # on their own, without `billingPeriod`/`usageMetrics` — a separate
      # step so a break here is distinguishable from a break in --stats'
      # larger query above.
      - name: Run --members against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs --members
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # --platform narrows AppOverview/BuildsPage to a single platform's
      # aliases instead of always requesting both — a separate step so a
      # break in that single-platform query shape is distinguishable from a
      # break in the always-both queries above.
      - name: Run --platform ios against the live EAS API
        run: node packages/expo-shelfit/bin/cli.mjs --platform ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `API canary failed on ${today}`,
              body:
                'The weekly EAS API canary run failed. This usually means the ' +
                'unofficial EAS GraphQL API changed a field the CLI depends on.\n\n' +
                `See the [failed run](${runUrl}) for details.`,
              labels: ['bug'],
            });
