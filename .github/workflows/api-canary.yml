name: API Canary

# The EAS GraphQL API this CLI depends on is unofficial and unversioned, so
# field names can change without notice. This runs weekly against the real
# API so a break is caught here first, not by a user's bug report.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run against the live EAS API
        run: node bin/cli.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `API canary failed on ${today}`,
              body:
                'The weekly EAS API canary run failed. This usually means the ' +
                'unofficial EAS GraphQL API changed a field the CLI depends on.\n\n' +
                `See the [failed run](${runUrl}) for details.`,
              labels: ['bug'],
            });
