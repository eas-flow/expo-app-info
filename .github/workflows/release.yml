name: Release

# Triggered by publishing a GitHub Release with a `v*.*.*` tag (e.g. v1.0.1).
# The tag itself doesn't identify which package(s) changed — this is a
# monorepo, and more than one package under packages/* can move in the same
# release. Instead, every package's local package.json version is compared
# against what's currently on npm; only the ones that differ get published.
# See CONTRIBUTING.md's "Releasing" section.

on:
  release:
    types: [published]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run lint

      - run: npm test --workspaces --if-present

      - name: Publish changed packages
        run: |
          set -e
          published_any=false
          for dir in packages/*/; do
            dir="${dir%/}"
            name=$(node -p "require('./$dir/package.json').name")
            local_version=$(node -p "require('./$dir/package.json').version")
            published_version=$(npm view "$name" version 2>/dev/null || echo "")
            if [ "$local_version" != "$published_version" ]; then
              echo "Publishing $name@$local_version (npm currently has: ${published_version:-none})"
              npm pack --dry-run --workspace="$dir"
              npm publish --workspace="$dir" --provenance --access public
              published_any=true
            else
              echo "Skipping $name — already at $local_version on npm"
            fi
          done
          if [ "$published_any" = false ]; then
            echo "::warning::No package version differs from what's published on npm — nothing was published. Did you forget to bump package.json before tagging this release?"
          fi
