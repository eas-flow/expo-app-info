name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm pack --dry-run

      # No NODE_AUTH_TOKEN: publish authenticates via OIDC through the
      # Trusted Publisher configuration on the npm package page (see issue #2).
      - run: npm publish --access public
