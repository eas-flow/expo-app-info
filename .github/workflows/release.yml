name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run lint

      - run: npm test --workspaces --if-present

      # This is a monorepo — packages/* are versioned and published
      # independently. changesets/action either:
      #   - opens/updates a "Version Packages" PR when unreleased changesets
      #     exist on main, or
      #   - runs the publish script (below) when that PR has just been
      #     merged and package.json versions were bumped, publishing every
      #     package whose version changed.
      # No manual `npm version` / `git tag` step either way.
      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
